[workspace]
resolver = "3"
members = ["crates/core", "crates/sync", "crates/ui", "crates/devserver", "crates/window-handle", "crates/updater", "apps/mailbox"]

[workspace.package]
version = "0.1.10"
edition = "2024"
publish = false

[workspace.dependencies]
mailbox-core = { path = "crates/core" }
mailbox-sync = { path = "crates/sync" }
mailbox-ui = { path = "crates/ui" }
mailbox-devserver = { path = "crates/devserver" }
mailbox-window-handle = { path = "crates/window-handle" }
mailbox-updater = { path = "crates/updater" }

# Exact versions are pinned by Cargo.lock; GPUI is pinned exactly because its crates move together.
chrono = { version = "0.4.45", features = ["serde"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
chrono-tz = "0.10"
# GPUI + gpui-component + Lucide icons. Renamed to `gpui` so GPUI derive macros resolve.
gpui = { package = "gpui-kit", version = "=0.9.0" }
# GPUI's Windows backend (vendored, see vendor/README.md): the frame clear color.
gpui-pre-windows = "=0.3.11"
# Sync (IMAP/SMTP/OAuth/credentials, MIME parsing).
imap = { version = "3.0.0-alpha.15", default-features = false, features = ["rustls-tls"] }
keyring = "4.2"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "rustls-tls", "hostname"] }
mail-parser = "0.11"
oauth2 = { version = "5", default-features = false, features = ["ureq"] }
# CalDAV/CardDAV (HTTP + WebDAV XML).
roxmltree = "0.21"
ureq = "2.12"
# Update package checksums (already in the lock file via deps).
sha2 = "0.10.9"
url = "2.5"
# Windows integration (notifications, mailto handler); already in the lock file via deps.
tauri-winrt-notification = "0.8.1"
windows-registry = "0.6.1"
# HTML mail bodies are shown in the system web engine (WebView2), see mail/webview.rs.
wry = { version = "0.57.2", default-features = false }
async-channel = "2.5.0"
raw-window-handle = "0.6.2"
# App icon: embedded in the exe (build), rendered from assets/icon.svg (examples/make_icon).
embed-resource = "3.0.12"
resvg = { version = "0.45.1", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
todo = "warn"

[profile.dev.package."*"]
opt-level = 2

# GPUI's Windows backend with one change (vendor/README.md): its DirectComposition layer is not
# topmost, so the mail webview (a child window) shows above it.
[patch.crates-io]
gpui-pre-windows = { path = "vendor/gpui-pre-windows" }
