[package]
name = "mailbox-window-handle"
description = "A GPUI window's native handle usable outside GPUI's App borrow (embedding the mail webview)"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
raw-window-handle.workspace = true

# Not `workspace = true`: this crate holds the workspace's only `unsafe` blocks (see lib.rs).
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
todo = "warn"
